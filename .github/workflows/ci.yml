name: Correctness and packaging
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - run: rustup override set 1.88.0
      - run: make bootstrap
      - run: npm --prefix web ci --ignore-scripts
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings
      - run: make test web docs
      - run: make demo RUN_ID=ci-demo && make verify EVIDENCE=evidence/ci-demo-demo
      - run: uv lock --check && uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 7
