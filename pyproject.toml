[project]
name = "aevum"
version = "0.1.0"
description = "Age-specific mortality, life tables, and demographic forecasts"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb==1.3.2",
    "numpy==2.2.6",
    "pyarrow==20.0.0",
    "scipy==1.15.3",
    "torch==2.8.0",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aevum*"]
